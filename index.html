<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../centinel/public/favicon.svg" />
  <link rel="stylesheet" href="src/CSS/output.css?v=1.2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>centinel</title>
</head>

<body class="min-h-screen flex flex-col justify-between bg-gray-100 text-gray-800">

  <!-- Header horizontal que abarca todo el ancho -->
  <header class="w-full bg-gray-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-3">
      <!-- Logo y marca -->
      <div class="flex items-center gap-3">
        <img src="./src/assets/vite.svg" alt="Mi Logo" class="h-8 w-auto">
        <span class="text-xl font-bold tracking-wide">Centinel</span>
      </div>

      <!-- Menú de navegación horizontal -->
      <nav class="shrink-0">
        <ul class="flex items-center gap-6 text-sm font-medium">
          <li>
            <a href="#" class="flex items-center gap-2 text-white hover:text-sky-300 transition-colors whitespace-nowrap" title="Soporte y Contacto">
              <!-- SVG de seguridad en color blanco con dimensiones fijas -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="w-6 h-6 shrink-0 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
              <span class="whitespace-nowrap font-medium text-sm">Soporte y Contacto</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido principal centrado -->
  <main class="flex-1 flex items-center justify-center p-4">
    <article class="w-full max-w-sm bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <form id="form" class="flex flex-col gap-4">
        <h1 class="text-2xl font-bold text-center text-gray-800">Iniciar Sesión</h1>

        <div class="flex flex-col gap-3">
          <label for="usuario_correo" class="flex flex-col text-sm font-medium text-gray-700 gap-1">
            Usuario / Correo:
            <input type="text" name="usuario_correo" id="usuarioCorreo"
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              required>
          </label>

          <label for="password" class="flex flex-col text-sm font-medium text-gray-700 gap-1">
            Contraseña:
            <input type="password" name="password" id="password"
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              required>
          </label>
        </div>

        <button type="submit" id="enviar"
          class="w-full mt-2 bg-sky-600 hover:bg-sky-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm cursor-pointer">
          Iniciar Sesión
        </button>

        <div class="text-red-600 text-sm font-semibold text-center mt-2 min-h-[1.25rem]" id="mensajeError"></div>
      </form>
    </article>
  </main>

  <!-- Pie de página horizontal al final -->
  <footer class="w-full py-4 text-center text-xs text-gray-500 bg-white border-t border-gray-200">
    <p>
      REPÚBLICA BOLIVARIANA DE VENEZUELA.
      UNIVERSIDAD BICENTENARIA DE ARAGUA.
      VICERRECTORADO ACADÉMICO. · FACULTAD DE INGENIERÍA. · ESCUELA DE INGENIERÍA DE SISTEMAS.
    </p>


  </footer>

  <script type="module" src="src/JS/main.js"></script>
</body>

</html>
